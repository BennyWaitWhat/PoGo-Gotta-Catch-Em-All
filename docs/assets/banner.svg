<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="PoGo — Gotta Catch 'Em All: your Pokémon GO storage, sorted. It never releases a thing.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="0.5" stop-color="#101a36"/>
      <stop offset="1" stop-color="#2a0f2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.46" r="0.45">
      <stop offset="0" stop-color="#ff3b5c" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff3b5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b5c"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>
  <g transform="translate(1075 166)" fill="none" stroke-linecap="round">
    <circle r="118" stroke="#ff3b5c" stroke-width="10" stroke-opacity="0.9"/>
    <path d="M-118 0 H-34 M34 0 H118" stroke="#ffffff" stroke-width="10" stroke-opacity="0.85"/>
    <circle r="34" stroke="#ffffff" stroke-width="10" stroke-opacity="0.9"/>
    <circle r="15" fill="url(#hot)" stroke="none"/>
    <circle r="158" stroke="#ffb020" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 10"/>
    <circle r="196" stroke="#ff3b5c" stroke-width="1" stroke-opacity="0.18"/>
  </g>
  <rect x="72" y="70" width="84" height="7" rx="3.5" fill="url(#hot)"/>
  <text x="70" y="146" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-0.5">PoGo · Gotta Catch ’Em All</text>
  <text x="72" y="192" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="27" fill="#e2e8f0">Your Pokémon GO storage, sorted. <tspan fill="#ffb020" font-weight="700">It never releases a thing.</tspan></text>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">
    <rect x="72" y="232" width="236" height="44" rx="22" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="92" y="260">📱 Rooted Android only</text>
    <rect x="322" y="232" width="232" height="44" rx="22" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="342" y="260">🛡 11 audits every cull</text>
    <rect x="568" y="232" width="258" height="44" rx="22" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="588" y="260">🏷 tags only — you release</text>
  </g>
  <text x="72" y="318" font-family="Consolas, Menlo, monospace" font-size="15" fill="#94a3b8">Pixel 9 Pro · Frida / IL2CPP · Claude cloud sessions over Tailscale</text>
