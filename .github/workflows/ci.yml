# Offline checks only: CI never has the phone, the game data or any secret. The 11-audit gate needs the phone's data
# store, so sessions run it themselves (`python tools/pogo_data.py pull`, then `full_audit.py --audits-only`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline checks (no phone, no data)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Every Python file compiles
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Every shell script parses
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: Self-tests
        run: |
          python tools/pogo_data.py selftest
          python pogo_extract/walk_tripwires.py --selftest
          python pogo_extract/cull_report.py --selftest
          python -c "import sys; sys.path.insert(0, 'pogo_extract'); import full_audit as f; s = f.phase_line([(1.1, 'dashboard started'), (37.6, 'recrawl ok'), (70.0, 'sync: no warnings in its log'), (200.0, 'retire: all clear')]); assert s == 'PHASES: dashboard 1.1 s, walk 36.5 s, sync 32.4 s, post-push 130.0 s | whole pass 200.0 s | SLOW: sync 32.4 s > 25 s; post-push 130.0 s > 30 s; whole pass 200.0 s > 120 s', s"
          python pogo_extract/bag_art.py --selftest
          python pogo_extract/game_opportunities.py --selftest
          python pogo_extract/independent_law.py
          python pogo_extract/pvp_combup.py
          python pogo_extract/evolve_targets.py --selfcheck
          python pogo_extract/sync_evolve_size.py --selfcheck
          python pogo_extract/remote_trade_picks.py --selfcheck
          bash tools/cull_now.sh --selfcheck
          python pogo_extract/system/scripts/check_constant_drift.py
          python pogo_extract/system/scripts/refresh_gamemaster.py --selftest
          python AutoCatcher/tools/test_gym_stab.py
          python AutoCatcher/tools/catcher_yield_sim.py
          python AutoCatcher/tools/catcher_apple_sim.py
          python AutoCatcher/tools/catcher_why_sim.py

      - name: Safety guards hold
        working-directory: pogo_extract
        run: |
          set +e
          python full_audit.py --audits-only
          rc=$?
          [ "$rc" -eq 2 ] || { echo "::error::full_audit.py ran without pokemon.db (rc=$rc, want 2)"; exit 1; }
          truncate -s 2M pokemon.db          # a DB-sized placeholder, so only the flag guard can stop the next call
          python full_audit.py --not-a-flag
          rc=$?
          rm -f pokemon.db
          [ "$rc" -eq 2 ] || { echo "::error::full_audit.py accepted an unknown flag (rc=$rc, want 2)"; exit 1; }
          echo "guards OK: no-data refusal and unknown-flag refusal both return 2"

      - name: Triple check (what sessions run before saying "done")
        run: python tools/triple_check.py

      - name: No secrets in the tree
        run: |
          if git grep -nIE 'AIza[0-9A-Za-z_-]{30,}|tskey-(auth|client|api)-[0-9A-Za-z]{8,}|gh[pousr]_[0-9A-Za-z]{30,}|xox[baprs]-[0-9A-Za-z-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::a key or token pattern is committed (see above) -- rotate it, then remove it"
            exit 1
          fi
          echo "no key or token patterns found"
